<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="themes.js"></script>
    <script src="background.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Nunito&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popupStyle.css">
    <link rel="icon" href="images/icon32.png" />
    <title>ReaDark</title>
  </head>
  <body>
    <h1 class="center">ReaDark</h1>

    <section class="section">
      <div class="section-header">
        <h3>Reading Mode</h3>
        <label class="switch">
          <input type="checkbox" id="readingCheckBox">
          <span class="slider round"></span>
        </label>
      </div>
      <p class="section-desc">Adds a warm yellow tint to reduce eye strain.</p>
    </section>

    <hr>

    <section class="section">
      <h3>Dark Theme</h3>
      <div class="theme-list" id="themeList"></div>
    </section>

    <div class="foot">
      <a href="https://onursert.com/" target="_blank">Developer: Onur Sert</a>
    </div>
  </body>
</html>
